<!DOCTYPE html>
<!--
  The social preview, assets/og-image.png (1200 × 630), from the 3.2.1 design's Social.dc.html.
  Jekyll leaves folders starting with _ out of the published site. Make the PNG with:
      node _tools/og-image.mjs
  (Playwright's Chromium; see that file.)
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Netti social preview</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/styles.css">
<style>
  body { margin: 0; background: var(--netti-color-navy-800); }
  .og {
    width: 1200px;
    height: 630px;
    padding: 72px;
    background: var(--netti-color-navy-800);
    color: var(--netti-color-white);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--netti-space-48);
    overflow: hidden;
    position: relative;
  }
  .og-copy { display: flex; flex-direction: column; gap: 28px; max-width: 600px; }
  .og-brand { display: flex; align-items: center; gap: 14px; font-size: 32px; line-height: 40px; font-weight: 700; }
  .og-brand img { width: 64px; height: 64px; border-radius: 15px; box-shadow: 0 0 0 1px var(--netti-color-white20); }
  .og-title { font-size: 64px; line-height: 68px; font-weight: 700; letter-spacing: -1.5px; }
  .og-sub { font-size: 24px; line-height: 32px; color: var(--netti-color-white70); }
  .og-card {
    flex: none;
    width: 380px;
    padding: var(--netti-space-32);
    border-radius: 28px;
    background: var(--netti-color-navy-700);
    border: 1px solid var(--netti-color-navy-600);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .og-eyebrow { font-size: 16px; line-height: 20px; font-weight: 500; letter-spacing: 0.6px; text-transform: uppercase; color: var(--netti-color-white70); }
  .og-figure { font-size: 68px; line-height: 76px; font-weight: 700; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; }
  .og-context { font-size: 18px; line-height: 26px; color: var(--netti-color-white70); }
  .og-tabs {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--netti-space-2);
    padding: var(--netti-space-4);
    margin-top: 10px;
    border-radius: var(--netti-radius-container);
    background: var(--netti-color-navy-600);
    font-size: 15px;
    line-height: 20px;
    text-align: center;
  }
  .og-tabs span { padding: 10px 0; color: var(--netti-color-white70); }
  .og-tabs .on { border-radius: var(--netti-radius-segment); background: var(--netti-color-white20); color: var(--netti-color-white); font-weight: 600; }
  .og-bar { position: absolute; left: 72px; right: 72px; bottom: 0; height: 6px; border-radius: 6px 6px 0 0; background: var(--netti-color-cyan-400); }
</style>
</head>
<body>
<div class="og">
  <div class="og-copy">
    <div class="og-brand"><img src="../assets/icons/favicon.svg" alt="">Netti</div>
    <p class="og-title">Your take-home pay, in seconds.</p>
    <p class="og-sub">UK take-home pay calculator for iPhone. HMRC 2026–27 rates. No account, no ads, no tracking.</p>
  </div>
  <div class="og-card">
    <p class="og-eyebrow">Take home</p>
    <p class="og-figure">£3,173</p>
    <p class="og-context">a month, on £48,000 after tax and National Insurance</p>
    <div class="og-tabs"><span>Yearly</span><span class="on">Monthly</span><span>Weekly</span><span>Daily</span></div>
  </div>
  <div class="og-bar" aria-hidden="true"></div>
</div>
</body>
</html>
